name: Release Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=dataset-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build manifest
        run: |
          python tools/build_manifest.py

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/manifest.json

          shopt -s nullglob
          ZIP_FILES=(dist/*.zip)

          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "No ZIP files found in dist/"
            exit 1
          fi

          echo "Release files:"
          ls -lh dist/

      - name: Check tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Dataset v${{ steps.version.outputs.version }}" \
            --notes "Dataset release ${{ steps.version.outputs.version }}" \
            dist/manifest.json \
            dist/*.zip

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}"

          echo ""
          echo "Manifest:"
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "manifest.json" \
            --dir /tmp/dataset-release

          cat /tmp/dataset-release/manifest.json