name: Release Dataset

on:
  push:
    tags:
      - 'dataset-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository INCLUDING Git LFS files
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # --------------------------------------------------
      # 3. Read and validate version.txt
      # --------------------------------------------------
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          TAG="${GITHUB_REF_NAME}"

          echo "version.txt: $VERSION"
          echo "Git tag:     $TAG"

          # Validate semantic version format
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version: $VERSION"
            exit 1
          fi

          # Expected tag
          EXPECTED_TAG="dataset-v${VERSION}"

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: Tag does not match version.txt"
            echo "Expected: $EXPECTED_TAG"
            echo "Actual:   $TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 4. Build manifest
      # --------------------------------------------------
      - name: Build manifest
        run: |
          python tools/build_manifest.py

      # --------------------------------------------------
      # 5. Verify build output
      # --------------------------------------------------
      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f dist/manifest.json ]; then
            echo "ERROR: dist/manifest.json not found"
            exit 1
          fi

          shopt -s nullglob
          ZIP_FILES=(dist/*.zip)

          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "ERROR: No ZIP files found in dist/"
            exit 1
          fi

          echo ""
          echo "=== Release files ==="
          ls -lh dist/

      # --------------------------------------------------
      # 6. Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Dataset v${{ steps.version.outputs.version }}" \
            --notes "Dataset release ${{ steps.version.outputs.version }}" \
            dist/manifest.json \
            dist/*.zip

      # --------------------------------------------------
      # 7. Verify GitHub Release
      # --------------------------------------------------
      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "=== Release information ==="

          gh release view "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}"

          echo ""
          echo "=== Downloading manifest for verification ==="

          rm -rf /tmp/dataset-release
          mkdir -p /tmp/dataset-release

          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "manifest.json" \
            --dir /tmp/dataset-release

          echo ""
          echo "=== Released manifest ==="

          cat /tmp/dataset-release/manifest.json

          echo ""
          echo "=== Release verification successful ==="
